
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Gun's Goblindeez ATTACK</title>
<link rel="stylesheet" href="css/jgg.css">
<link rel="icon" type="image/png" href="other/logo.png">
</head>
<body>
<div id="layout">
    <div id="game">
        <!-- start menü -->
        <div id="startMenu">
            <h1>JOHN GUN'S<br>GOBLINDEEZ ATTACK</h1>
            <button id="startButton" onclick="startGame()">START GAME</button>
        </div>

        <!-- pause menü -->
        <div id="pauseMenu">
            <h1>PAUSED</h1>
            <button onclick="togglePause()">RESUME</button>
            <button onclick="location.reload()">RESTART</button>
        </div>

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <img id="player" src="player/john_gun_idle.gif">

        <!-- game over menü -->
        <div id="gameover">
            <h1>GAME OVER</h1>
            <p id="finalscore"></p>
            <button onclick="location.reload()">RESTART</button>
        </div>
    </div>

    <div id="sidebar">
        <h1>John Gun's Goblindeez ATTACK</h1>

        <div class="stat">
            <h2>SCORE</h2>
            <p id="score">0</p>
        </div>

        <div class="stat">
            <h2>HEALTH</h2>
            <p id="health">100</p>
        </div>

        <div id="audioControls">
            <button id="pauseButton" onclick="togglePause()">
                <img src="other/pause_button.png" alt="Pause">
                <label>PAUSE</label>
            </button>

            <button id="musicButton" onclick="toggleMusic()">
                <img id="musicButtonImage" src="other/music_on.png" alt="Music on">
                <label>MUSIC ON/OFF</label>
            </button>

            <button id="sfxButton" onclick="toggleSfx()">
                <img id="sfxButtonImage" src="other/sfx_on.png" alt="SFX on">
                <label>SFX ON/OFF</label>
            </button>
        </div>

        <div id="controls">
            <b>CONTROLS</b><br>
            W / ↑ = Move up<br>
            S / ↓ = Move down<br>
            SPACE = Shoot
            <br><br>
            <b>REWARD</b><br>
            +20 Health every 50 points
        </div>
    </div>
</div>

<script src="script/jgg.js"></script>
</body>
</html>
