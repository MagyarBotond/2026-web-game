
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>GIF Shooter</title>

<style>
* {
    box-sizing: border-box;
}

html, body {
    margin: 0;
    padding: 0;
    width: 100%;
    height: 100%;
    overflow: hidden;
}

body {
    background: #111;
    color: white;
    font-family: Arial, sans-serif;
}

#layout {
    display: flex;
    width: 100vw;
    height: 100vh;
}

#game {
    position: relative;
    width: 80%;
    height: 100%;
    background: #222;
    overflow: hidden;
    border-right: 4px solid white;
}

#sidebar {
    width: 20%;
    height: 100%;
    background: #151515;
    display: flex;
    flex-direction: column;
    align-items: center;
    padding: 35px 12px;
    gap: 30px;
}

#sidebar h1 {
    font-size: clamp(22px, 2.5vw, 38px);
    text-align: center;
    margin: 0;
}

.stat {
    width: 100%;
    padding: 20px 8px;
    background: #292929;
    border: 3px solid #555;
    border-radius: 15px;
    text-align: center;
}

.stat h2 {
    font-size: clamp(18px, 2vw, 27px);
    margin: 0 0 12px;
}

.stat p {
    font-size: clamp(25px, 3vw, 40px);
    font-weight: bold;
    margin: 0;
}

#score {
    color: #ffdf35;
}

#health {
    color: #ff4545;
}

#controls {
    text-align: center;
    font-size: clamp(13px, 1.4vw, 20px);
    line-height: 1.8;
}

#player {
    position: absolute;
    width: 150px;
    height: 150px;
    object-fit: contain;
    left: 35px;
    z-index: 5;
}

.enemy {
    position: absolute;
    width: 130px;
    height: 130px;
    object-fit: contain;
}

.bullet {
    position: absolute;
    width: 40px;
    height: 14px;
    background: yellow;
    border-radius: 8px;
    box-shadow: 0 0 12px yellow;
}

.lane {
    position: absolute;
    left: 0;
    width: 100%;
    height: 2px;
    background: #444;
    pointer-events: none;
}

#gameover {
    display: none;
    position: absolute;
    inset: 0;
    background: #000e;
    z-index: 30;
    text-align: center;
    padding-top: 150px;
}

#gameover h1 {
    font-size: 65px;
}

#gameover p {
    font-size: 35px;
}

#gameover button {
    padding: 18px 35px;
    font-size: 28px;
    cursor: pointer;
}
</style>
</head>

<body>

<div id="layout">

    <div id="game">

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <img id="player" src="john_gun_idle.gif">

        <div id="gameover">
            <h1>GAME OVER</h1>
            <p id="finalscore"></p>
            <button onclick="location.reload()">RESTART</button>
        </div>

    </div>

    <div id="sidebar">

        <h1>GIF SHOOTER</h1>

        <div class="stat">
            <h2>SCORE</h2>
            <p id="score">0</p>
        </div>

        <div class="stat">
            <h2>HEALTH</h2>
            <p id="health">100</p>
        </div>

        <div id="controls">
            <b>CONTROLS</b><br>
            W / ↑ = Move up<br>
            S / ↓ = Move down<br>
            SPACE = Shoot

            <br><br>

            <b>ENEMIES</b><br>
            Normal = 1 shot<br>
            Armored = 3 shots<br>
            Fast = 1 shot<br>
            Super Fast = 1 shot

            <br><br>

            <b>REWARD</b><br>
            +20 Health every 50 points
        </div>

    </div>

</div>

<script>

// =================================
// ELEMENTS
// =================================

const game = document.getElementById("game");
const player = document.getElementById("player");


// =================================
// GIF FILES
// =================================

const idleGif = "john_gun_idle.gif";
const shootGif = "john_gun_shoot.gif";

const normalEnemyGif = "goblindeez.gif";
const armoredEnemyGif = "goblindeez_tuff.gif";
const fastEnemyGif = "goblindeez_fast.gif";
const skellyEnemyGif = "goblindeez_skelly.gif";


// =================================
// GAME VARIABLES
// =================================

let lane = 2;
let score = 0;
let health = 100;

let enemies = [];
let bullets = [];

let shooting = false;
let gameRunning = true;
let shootTimer = null;


// =================================
// SETTINGS
// =================================

const laneCount = 5;

const frame5Time = 400;
const shootInterval = 400;

const playerSize = 150;
const enemySize = 130;

const healthRewardInterval = 50;
const healthRewardAmount = 20;
const maxHealth = 100;

let nextHealthReward = 50;


// ENEMY SETTINGS

const normalSpeed = 3;

const armoredSpeed = 3;
const armoredHealth = 3;

const fastSpeed = 6;
const skellySpeed = fastSpeed * 2;


// =================================
// LANE HEIGHT
// =================================

function getLaneHeight() {
    return game.clientHeight / laneCount;
}


// =================================
// PLAYER POSITION
// =================================

function updatePlayer() {

    const laneHeight = getLaneHeight();

    player.style.top =
        lane * laneHeight +
        (laneHeight - playerSize) / 2 +
        "px";
}


// =================================
// LANE LINES
// =================================

function updateLanes() {

    const laneHeight = getLaneHeight();

    document.querySelectorAll(".lane").forEach((line, i) => {

        line.style.top = (i + 1) * laneHeight + "px";

    });

    updatePlayer();
}

updateLanes();

window.addEventListener("resize", updateLanes);


// =================================
// SHOOTING
// =================================

function startShooting() {

    if (shooting || !gameRunning) return;

    shooting = true;

    function fire() {

        if (!shooting || !gameRunning) return;

        player.src = "";

        requestAnimationFrame(() => {

            if (shooting && gameRunning) {
                player.src = shootGif;
            }

        });

        shootTimer = setTimeout(() => {

            if (!shooting || !gameRunning) return;

            shoot();

            shootTimer = setTimeout(fire, 0);

        }, frame5Time);
    }

    fire();
}


// STOP SHOOTING

function stopShooting() {

    shooting = false;

    clearTimeout(shootTimer);
    shootTimer = null;

    if (gameRunning) {
        player.src = idleGif;
    }
}


// =================================
// CONTROLS
// =================================

document.addEventListener("keydown", (e) => {

    if (!gameRunning) return;

    if (
        (e.code === "ArrowUp" || e.code === "KeyW")
        && !e.repeat
    ) {

        lane = Math.max(0, lane - 1);

        updatePlayer();
    }

    if (
        (e.code === "ArrowDown" || e.code === "KeyS")
        && !e.repeat
    ) {

        lane = Math.min(4, lane + 1);

        updatePlayer();
    }

    if (e.code === "Space") {

        e.preventDefault();

        startShooting();
    }

});


// RELEASE SPACE

document.addEventListener("keyup", (e) => {

    if (e.code === "Space") {
        stopShooting();
    }

});

window.addEventListener("blur", stopShooting);


// =================================
// CREATE BULLETS
// =================================

function shoot() {

    const bullet = document.createElement("div");

    const bulletX = player.offsetLeft + playerSize;

    bullet.className = "bullet";

    bullet.style.left = bulletX + "px";

    bullet.style.top =
        lane * getLaneHeight() +
        getLaneHeight() / 2 -
        7 +
        "px";

    game.appendChild(bullet);

    bullets.push({

        element: bullet,
        x: bulletX,
        lane: lane

    });
}


// =================================
// SPAWN ENEMIES
// =================================

function spawnEnemy() {

    if (!gameRunning) return;

    const enemy = document.createElement("img");

    const enemyLane = Math.floor(Math.random() * laneCount);

    const enemyX = game.clientWidth;

    const random = Math.random();

    let enemyType;
    let enemyHealth;
    let enemySpeed;

    if (random < 0.60) {

        // NORMAL ENEMY
        enemyType = normalEnemyGif;
        enemyHealth = 1;
        enemySpeed = normalSpeed;

    } else if (random < 0.80) {

        // ARMORED ENEMY
        enemyType = armoredEnemyGif;
        enemyHealth = armoredHealth;
        enemySpeed = armoredSpeed;

    } else if (random < 0.95) {

        // FAST ENEMY
        enemyType = fastEnemyGif;
        enemyHealth = 1;
        enemySpeed = fastSpeed;

    } else {

        // SUPER FAST ENEMY
        enemyType = skellyEnemyGif;
        enemyHealth = 1;
        enemySpeed = skellySpeed;

    }

    enemy.src = enemyType;
    enemy.className = "enemy";

    enemy.style.left = enemyX + "px";

    enemy.style.top =
        enemyLane * getLaneHeight() +
        (getLaneHeight() - enemySize) / 2 +
        "px";

    game.appendChild(enemy);

    enemies.push({

        element: enemy,
        x: enemyX,
        lane: enemyLane,

        hp: enemyHealth,
        maxHp: enemyHealth,

        speed: enemySpeed

    });
}


// =================================
// UPDATE SCORE AND HEALTH
// =================================

function updateHUD() {

    document.getElementById("score").textContent = score;

    document.getElementById("health").textContent = health;

}


// =================================
// HEALTH REWARD
// =================================

function checkHealthReward() {

    if (score >= nextHealthReward) {

        health = Math.min(
            maxHealth,
            health + healthRewardAmount
        );

        nextHealthReward += healthRewardInterval;

        updateHUD();

    }
}


// =================================
// DAMAGE PLAYER
// =================================

function damagePlayer() {

    health -= 20;

    if (health < 0) {
        health = 0;
    }

    updateHUD();

    if (health <= 0) {

        endGame();

        return true;
    }

    return false;
}


// =================================
// MAIN GAME LOOP
// =================================

function update() {

    if (!gameRunning) return;


    // MOVE ENEMIES

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        enemy.x -= enemy.speed;

        enemy.element.style.left = enemy.x + "px";


        // ENEMY REACHES PLAYER

        if (

            enemy.x < player.offsetLeft + playerSize &&
            enemy.x + enemySize > player.offsetLeft &&
            enemy.lane === lane

        ) {

            enemy.element.remove();

            enemies.splice(i, 1);

            if (damagePlayer()) return;

            continue;
        }


        // ENEMY ESCAPES SCREEN

        if (enemy.x < -enemySize) {

            enemy.element.remove();

            enemies.splice(i, 1);

            if (damagePlayer()) return;

        }

    }


    // MOVE BULLETS

    for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        bullet.x += 12;

        bullet.element.style.left = bullet.x + "px";

        let hit = false;


        // CHECK ENEMY COLLISIONS

        for (let j = enemies.length - 1; j >= 0; j--) {

            const enemy = enemies[j];

            if (

                bullet.lane === enemy.lane &&

                bullet.x + 40 > enemy.x &&

                bullet.x < enemy.x + enemySize

            ) {

                bullet.element.remove();

                bullets.splice(i, 1);

                enemy.hp--;

                hit = true;


                // ENEMY DEFEATED

                if (enemy.hp <= 0) {

                    enemy.element.remove();

                    enemies.splice(j, 1);

                    score++;

                    updateHUD();

                    checkHealthReward();

                }

                break;
            }

        }

        if (hit) continue;


        // REMOVE BULLETS OFFSCREEN

        if (bullet.x > game.clientWidth) {

            bullet.element.remove();

            bullets.splice(i, 1);

        }

    }


    requestAnimationFrame(update);

}


// =================================
// GAME OVER
// =================================

function endGame() {

    gameRunning = false;

    stopShooting();

    document.getElementById("gameover").style.display = "block";

    document.getElementById("finalscore").textContent =
        "Your score: " + score;

}


// =================================
// SPAWN ENEMIES EVERY 1.5 SECONDS
// =================================

setInterval(() => {

    if (gameRunning) {

        spawnEnemy();

    }

}, 1500);


// =================================
// START GAME
// =================================

update();

</script>

</body>
</html>
