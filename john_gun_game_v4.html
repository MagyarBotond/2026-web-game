
<!DOCTYPE html>
<html>
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>John Gun's Goblindeez ATTACK</title>

<link rel="stylesheet" href="css/jgg.css">


</head>

<body>

<div id="layout">

    <div id="game">

        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>
        <div class="lane"></div>

        <img id="player" src="player/john_gun_idle.gif">

        <div id="gameover">
            <h1>GAME OVER</h1>
            <p id="finalscore"></p>
            <button onclick="location.reload()">RESTART</button>
        </div>

    </div>

    <div id="sidebar">

        <h1>John Gun's Goblindeez ATTACK</h1>

        <div class="stat">
            <h2>SCORE</h2>
            <p id="score">0</p>
        </div>

        <div class="stat">
            <h2>HEALTH</h2>
            <p id="health">100</p>
        </div>

        <div id="controls">
            <b>CONTROLS</b><br>
            W / ↑ = Move up<br>
            S / ↓ = Move down<br>
            SPACE = Shoot

            <br><br>

            <b>REWARD</b><br>
            +20 Health every 50 points
        </div>

    </div>

</div>

<script>

// =================================
// ELEMENTS
// =================================

const game = document.getElementById("game");
const player = document.getElementById("player");


// =================================
// GIF FILES
// =================================

const idleGif = "player/john_gun_idle.gif";
const shootGif = "player/john_gun_shoot.gif";

const normalEnemyGif = "enemies/goblindeez.gif";
const armoredEnemyGif = "enemies/goblindeez_tuff.gif";
const fastEnemyGif = "enemies/goblindeez_fast.gif";
const skellyEnemyGif = "enemies/goblindeez_skelly.gif";

// NEW ENEMIES - add these GIF files to your enemies folder
const minionEnemyGif = "enemies/goblindeez_imp.gif";
const wizardWalkGif = "enemies/wizard_walk.gif";
const wizardSummoningGif = "enemies/wizard_summon.gif";
const wizardSpawningGif = "enemies/wizard_shoot.gif";

// NEW IMAGE FILES
const bulletGif = "other/bullet.png";
const enemyHitGif = "other/boom.gif";

const wizardSummonSound = new Audio("sounds/wizard_enemysummon.mp3");
const wizardSummonDoneSound = new Audio("sounds/wizard_summondone.mp3");
const MinionspawnSound = new Audio("sounds/imp_spawn.mp3");
const skellyspawnSound = new Audio("sounds/skelly_spawn.mp3");
skellyspawnSound.volume = 0.45;


// player sounds
const shootingSounds = [
    new Audio("sounds/johngun_shoot1.mp3"),
    new Audio("sounds/johngun_shoot2.mp3")
];

shootingSounds.forEach(sound => {
    sound.volume = 0.5;
});
let nextShootingSound = 0;

// =================================
// GAME VARIABLES
// =================================

let lane = 2;
let score = 0;
let health = 100;

let enemies = [];
let bullets = [];

let shooting = false;
let gameRunning = true;
let shootTimer = null;


// =================================
// SETTINGS
// =================================

const laneCount = 5;

const frame5Time = 400;

const playerSize = 150;
const enemySize = 130;

const bulletWidth = 50;
const bulletHeight = 30;
const bulletSpeed = 12;

const hitEffectDuration = 250;

const healthRewardInterval = 50;
const healthRewardAmount = 20;
const maxHealth = 100;

let nextHealthReward = 50;


// ENEMY SETTINGS

const normalSpeed = 1.5;

const armoredSpeed = 1;
const armoredHealth = 3;

const fastSpeed = 5;

const skellySpeed = 7;

const minionSpeed = 1;
const minionHealth = 2;

const wizardSpeed = .2;
const wizardHealth = 10;

// Wizard timing. The spawning GIF duration must be set to its actual length.
const wizardWalkDuration = 7000;
const wizardSummoningDuration = 10000;
const wizardSpawningDuration = 3000; // Change this to match wizard_spawning.gif


// =================================
// LANE HEIGHT
// =================================

function getLaneHeight() {
    return game.clientHeight / laneCount;
}


// =================================
// PLAYER POSITION
// =================================

function updatePlayer() {

    const laneHeight = getLaneHeight();

    player.style.top =
        lane * laneHeight +
        (laneHeight - playerSize) / 2 +
        "px";
}


// =================================
// LANE LINES
// =================================

function updateLanes() {

    const laneHeight = getLaneHeight();

    document.querySelectorAll(".lane").forEach((line, i) => {
        line.style.top = (i + 1) * laneHeight + "px";
    });

    updatePlayer();
}

updateLanes();

window.addEventListener("resize", updateLanes);


// =================================
// SHOOTING
// =================================

function startShooting() {

    if (shooting || !gameRunning) return;

    shooting = true;

    function fire() {

        if (!shooting || !gameRunning) return;

        player.src = "";

        requestAnimationFrame(() => {
            if (shooting && gameRunning) {
                player.src = shootGif;
            }
        });

        shootTimer = setTimeout(() => {

            if (!shooting || !gameRunning) return;

            shoot();

            shootTimer = setTimeout(fire, 0);

        }, frame5Time);
    }

    fire();
}


// STOP SHOOTING

function stopShooting() {

    shooting = false;

    clearTimeout(shootTimer);
    shootTimer = null;

    if (gameRunning) {
        player.src = idleGif;
    }
}


// =================================
// CONTROLS
// =================================

document.addEventListener("keydown", (e) => {

    if (!gameRunning) return;

    if (
        (e.code === "ArrowUp" || e.code === "KeyW")
        && !e.repeat
    ) {
        lane = Math.max(0, lane - 1);
        updatePlayer();
    }

    if (
        (e.code === "ArrowDown" || e.code === "KeyS")
        && !e.repeat
    ) {
        lane = Math.min(4, lane + 1);
        updatePlayer();
    }

    if (e.code === "Space") {
        e.preventDefault();
        startShooting();
    }

});


// RELEASE SPACE

document.addEventListener("keyup", (e) => {

    if (e.code === "Space") {
        stopShooting();
    }

});

window.addEventListener("blur", stopShooting);


// =================================
// CREATE IMAGE BULLETS
// =================================

function shoot() {

    const bullet = document.createElement("img");
    
    const sound = shootingSounds[nextShootingSound];
    sound.currentTime = 0;
    sound.play().catch(() => {});

    nextShootingSound = 1 - nextShootingSound;

    const bulletX = player.offsetLeft + playerSize;

    bullet.src = bulletGif;
    bullet.className = "bullet";

    bullet.style.left = bulletX + "px";

    bullet.style.top =
        lane * getLaneHeight() +
        getLaneHeight() / 2 -
        bulletHeight / 2 +
        "px";

    game.appendChild(bullet);

    bullets.push({

        element: bullet,
        x: bulletX,
        lane: lane

    });
}


// =================================
// ENEMY HIT EFFECT
// =================================

function showHitEffect(enemy) {

    const effect = document.createElement("img");

    effect.src = enemyHitGif;
    effect.className = "hit-effect";

    effect.style.left = enemy.x + "px";

    effect.style.top =
        enemy.lane * getLaneHeight() +
        (getLaneHeight() - enemySize) / 2 +
        "px";

    game.appendChild(effect);

    setTimeout(() => {
        effect.remove();
    }, hitEffectDuration);
}


// =================================
// SPAWN ENEMIES
// =================================

function addEnemyImage(imageSrc, enemyX, enemyLane, hp, speed, type) {

    const element = document.createElement("img");
    element.src = imageSrc;
    element.className = "enemy";
    element.style.left = enemyX + "px";
    element.style.top =
        enemyLane * getLaneHeight() +
        (getLaneHeight() - enemySize) / 2 +
        "px";

    game.appendChild(element);

    const enemy = {
        element,
        x: enemyX,
        lane: enemyLane,
        hp,
        maxHp: hp,
        speed,
        type,
        phase: "walking",
        cycleTimer: null
    };

    enemies.push(enemy);
    return enemy;
}

function spawnMinion(enemyX, enemyLane) {
    if (!gameRunning) return;
    addEnemyImage(minionEnemyGif, enemyX, enemyLane, minionHealth, minionSpeed, "minion");
}

function startWizardCycle(wizard) {
    if (!gameRunning || !enemies.includes(wizard)) return;

    wizard.cycleTimer = setTimeout(() => {
        if (!gameRunning || !enemies.includes(wizard)) return;

        wizard.phase = "summoning";
        wizard.element.src = wizardSummoningGif;

        wizardSummonSound.currentTime = 0;
        wizardSummonSound.play().catch(() => {});

        wizard.cycleTimer = setTimeout(() => {
            if (!gameRunning || !enemies.includes(wizard)) return;

            wizard.phase = "spawning";
            wizard.element.src = wizardSpawningGif;

            wizardSummonDoneSound.currentTime = 0;
            wizardSummonDoneSound.play().catch(() => {});

            wizard.cycleTimer = setTimeout(() => {
                if (!gameRunning || !enemies.includes(wizard)) return;

                const availableLanes = [0, 1, 2, 3, 4];

                // Shuffle lanes randomly

                availableLanes.sort(() => Math.random() - 0.5);


                // Create three minions around the wizard's lane.
                for (let i = 0; i < 3; i++) {
                    const minionLane = availableLanes[i];

                    spawnMinion(wizard.x + enemySize, minionLane);
                    MinionspawnSound.currentTime = 0;
                    MinionspawnSound.play().catch(() => {});
                }

                wizard.phase = "walking";
                wizard.element.src = wizardWalkGif;
                startWizardCycle(wizard);
            }, wizardSpawningDuration);
        }, wizardSummoningDuration);
    }, wizardWalkDuration);
}

function clearEnemyTimers(enemy) {
    if (enemy && enemy.cycleTimer !== null) {
        clearTimeout(enemy.cycleTimer);
        enemy.cycleTimer = null;
    }
}

function spawnEnemy() {

    if (!gameRunning) return;

    const enemyLane = Math.floor(Math.random() * laneCount);
    const enemyX = game.clientWidth;
    const random = Math.random();

    // Wizards are uncommon; they summon three minions during each cycle.
    if (random < 0.05) {
        const wizard = addEnemyImage(
            wizardWalkGif, enemyX, enemyLane,
            wizardHealth, wizardSpeed, "wizard"
        );
        startWizardCycle(wizard);
        return;
    }

    let enemyType;
    let enemyHealth;
    let enemySpeed;

    //---------------------------------

    if (random < 0.60) {
        enemyType = normalEnemyGif;
        enemyHealth = 1;
        enemySpeed = normalSpeed;
    } else if (random < 0.80) {
        enemyType = armoredEnemyGif;
        enemyHealth = armoredHealth;
        enemySpeed = armoredSpeed;
    } else if (random < 0.95) {
        enemyType = fastEnemyGif;
        enemyHealth = 1;
        enemySpeed = fastSpeed;
    } else {
        enemyType = skellyEnemyGif;
        enemyHealth = 1;
        enemySpeed = skellySpeed;
        skellyspawnSound.currentTime = 0;
        skellyspawnSound.play().catch(() => {});
    }

    addEnemyImage(enemyType, enemyX, enemyLane, enemyHealth, enemySpeed, "normal");
}


// =================================
// UPDATE SCORE AND HEALTH
// =================================

function updateHUD() {

    document.getElementById("score").textContent = score;
    document.getElementById("health").textContent = health;

}


// =================================
// HEALTH REWARD
// =================================

function checkHealthReward() {

    if (score >= nextHealthReward) {

        health = Math.min(
            maxHealth,
            health + healthRewardAmount
        );

        nextHealthReward += healthRewardInterval;

        updateHUD();
    }
}


// =================================
// DAMAGE PLAYER
// =================================

function damagePlayer() {

    health -= 20;

    if (health < 0) {
        health = 0;
    }

    updateHUD();

    if (health <= 0) {
        endGame();
        return true;
    }

    return false;
}


// =================================
// MAIN GAME LOOP
// =================================

function update() {

    if (!gameRunning) return;


    // MOVE ENEMIES

    for (let i = enemies.length - 1; i >= 0; i--) {

        const enemy = enemies[i];

        // Wizards pause their movement while summoning and spawning.
        if (enemy.type === "wizard" && enemy.phase !== "walking") {
            continue;
        }

        enemy.x -= enemy.speed;

        enemy.element.style.left = enemy.x + "px";


        // ENEMY REACHES PLAYER

        if (
            enemy.x < player.offsetLeft + playerSize &&
            enemy.x + enemySize > player.offsetLeft &&
            enemy.lane === lane
        ) {

            clearEnemyTimers(enemy);
            enemy.element.remove();

            enemies.splice(i, 1);

            if (damagePlayer()) return;

            continue;
        }


        // ENEMY ESCAPES SCREEN

        if (enemy.x < -enemySize) {

            clearEnemyTimers(enemy);
            enemy.element.remove();

            enemies.splice(i, 1);

            if (damagePlayer()) return;
        }

    }


    // MOVE BULLETS

    for (let i = bullets.length - 1; i >= 0; i--) {

        const bullet = bullets[i];

        bullet.x += bulletSpeed;

        bullet.element.style.left = bullet.x + "px";

        let hit = false;


        // CHECK ENEMY COLLISIONS

        for (let j = enemies.length - 1; j >= 0; j--) {

            const enemy = enemies[j];

            if (
                bullet.lane === enemy.lane &&
                bullet.x + bulletWidth > enemy.x &&
                bullet.x < enemy.x + enemySize
            ) {

                // REMOVE BULLET

                bullet.element.remove();
                bullets.splice(i, 1);

                // SHOW HIT EFFECT

                showHitEffect(enemy);

                // DAMAGE ENEMY

                enemy.hp--;

                hit = true;


                // ENEMY DEFEATED

                if (enemy.hp <= 0) {

                    clearEnemyTimers(enemy);
                    enemy.element.remove();

                    enemies.splice(j, 1);

                    score++;

                    updateHUD();

                    checkHealthReward();
                }

                break;
            }

        }

        if (hit) continue;


        // REMOVE BULLETS OFFSCREEN

        if (bullet.x > game.clientWidth) {

            bullet.element.remove();

            bullets.splice(i, 1);
        }

    }

    requestAnimationFrame(update);
}


// =================================
// GAME OVER
// =================================

function endGame() {

    gameRunning = false;

    // Stop any wizard animation cycles when the game ends.
    enemies.forEach(clearEnemyTimers);
    stopShooting();

    document.getElementById("gameover").style.display = "block";

    document.getElementById("finalscore").textContent =
        "Your score: " + score;

}


// =================================
// SPAWN ENEMIES EVERY 1.5 SECONDS
// =================================

setInterval(() => {

    if (gameRunning) {
        spawnEnemy();
    }

}, 1500);


// =================================
// START GAME
// =================================

update();

</script>

</body>
</html>
